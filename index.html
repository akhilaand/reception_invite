<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Akhil & Sreya</title>
  <meta name="description" content="Welcome to the wedding invitation portal of Akhil & Sreya. Please select an invitation to view details.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="split-portal">

    <!-- Left Panel: Wedding Ceremony -->
    <a href="wedding/" class="portal-panel panel-wedding">
      <div class="panel-bg-container">
        <img src="assets/images/marriage.webp" alt="Wedding Background" class="panel-bg">
      </div>
      <div class="panel-overlay"></div>
      <div class="panel-content">
        <span class="panel-icon">🕊️</span>
        <h2 class="panel-title">Wedding Ceremony</h2>
        <p class="panel-details">Sunday, September 13 • 11:00 AM</p>
        <span class="panel-btn">Open Invitation</span>
      </div>
    </a>

    <!-- Right Panel: Wedding Reception -->
    <a href="reception/" target="_blank" rel="noopener" class="portal-panel panel-reception">
      <div class="panel-bg-container">
        <img src="assets/images/footer1.webp" alt="Reception Background" class="panel-bg">
      </div>
      <div class="panel-overlay"></div>
      <div class="panel-content">
        <span class="panel-icon">🥂</span>
        <h2 class="panel-title">Wedding Reception</h2>
        <p class="panel-details">Monday, September 14 • 06:00 PM</p>
        <span class="panel-btn">Open Invitation</span>
      </div>
    </a>

    <!-- Overlapping Floating Center Badge -->
    <div class="center-badge-container">
      <div class="center-badge">
        <p class="badge-subtitle">You are Invited</p>
        <h1 class="badge-names">Akhil &amp; Sreya</h1>
        <div class="badge-divider">✦</div>
        <p class="badge-date">13 . 09 . 2026</p>
      </div>
    </div>

  </div>
</body>
</html>
